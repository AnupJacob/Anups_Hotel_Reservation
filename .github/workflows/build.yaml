name: Build pipeline
on:
    push:
      branches: main
    pull_request:
      branches: main

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      $ECR_REPOSITORY: "anups_hotel_reservations"
      IMAGE_TAG: ${{github.run_number}}.0.0-test
      ECR_REGISTRY: "590183772773.dkr.ecr.eu-west-1.amazonaws.com"

    steps:
    - name: Repository checkout
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        echo "Repo is : $ECR_REPOSITORY"
        docker build -f Dockerfile -t $ECR_REPOSITORY .
        docker tag $ECR_REPOSITORY:latest "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"